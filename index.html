<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가나다 사전 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 배치: 하늘 위 사전 섬. 가운데 한 단(최대 720px), 두툼한 입체 버튼, 책 모양 길잡이 '가나'. 밝은 한 가지 테마로 고정. */
:root{
  color-scheme: light;
  --sky1:#3fa9f5; --sky2:#c9ecff;
  --ink:#17304f; --ink-soft:#4d6688;
  --card:#ffffff; --line:#b9d6f5;
  --blue:#1f6fd0; --blue-deep:#0f4a96;
  --sun:#ffcd45; --sun-deep:#dfa313;
  --good:#19b27a; --bad:#f0554a; --grape:#7b5cff;
  --display:"Jua","Gowun Dodum","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  background:linear-gradient(var(--sky1),var(--sky2) 70%,#e6f7df) fixed}
body.fever{background:linear-gradient(#ff7a3d,#ffc24d 65%,#fff0bd) fixed}
body::before{content:"";position:fixed;inset:-10% -50%;pointer-events:none;z-index:0;opacity:.85;
  background:
   radial-gradient(60px 26px at 12% 14%,#fff 98%,transparent),radial-gradient(44px 22px at 15% 12%,#fff 98%,transparent),
   radial-gradient(80px 30px at 46% 30%,#fff 98%,transparent),radial-gradient(50px 26px at 49% 27%,#fff 98%,transparent),
   radial-gradient(70px 28px at 78% 10%,#fff 98%,transparent),radial-gradient(46px 24px at 75% 8%,#fff 98%,transparent),
   radial-gradient(64px 26px at 30% 62%,#fff 98%,transparent),radial-gradient(74px 28px at 88% 52%,#fff 98%,transparent)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
#app{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px;min-height:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0}
#banners{position:fixed;left:0;right:0;top:58px;z-index:55;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.center{justify-content:center;text-align:center;align-items:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;color:#fff;text-shadow:0 2px 0 var(--blue-deep);padding:0}
.pill{background:var(--card);border-radius:999px;padding:6px 16px;font-size:16px;box-shadow:0 3px 0 rgba(15,74,150,.25)}

.sheet{background:var(--card);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 rgba(15,74,150,.22)}
.lead{font-size:28px;color:var(--blue-deep)}
.sub{color:var(--ink-soft);margin:0}
.hero{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.logo{font-size:46px;line-height:1.05;color:#fff;text-shadow:0 4px 0 var(--blue-deep),0 8px 0 rgba(15,74,150,.25)}
.bubble{position:relative;background:var(--card);border-radius:20px;padding:12px 18px;font-family:var(--display);font-size:22px;color:var(--blue-deep);box-shadow:0 5px 0 rgba(15,74,150,.22);max-width:420px}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--card);border-left:0}

.btn{background:var(--blue);color:#fff;border-radius:16px;padding:12px 22px;font-family:var(--display);font-size:20px;box-shadow:0 5px 0 var(--blue-deep)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-deep)}
.btn.ghost{background:var(--card);color:var(--blue-deep);box-shadow:0 5px 0 var(--line)}
.btn.warn{background:var(--bad);box-shadow:0 5px 0 #b93229}
.btn:disabled{opacity:.4;cursor:default}
.big{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border-radius:22px;padding:16px 20px;color:#fff;background:var(--blue);box-shadow:0 7px 0 var(--blue-deep)}
.big b{font-family:var(--display);font-weight:400;font-size:28px;display:block;line-height:1.2}
.big span{font-size:16px}
.big.sun{background:var(--sun);color:var(--ink);box-shadow:0 7px 0 var(--sun-deep)}
.big.grape{background:var(--grape);box-shadow:0 7px 0 #523bc0}
.big .ico{flex:none;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;font-family:var(--display);font-size:30px}
.btn:active,.big:active,.node:active,.gap:active,.pool button:active,.item:active,.keys button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.stat{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 16px;font-family:var(--display);font-size:18px;color:var(--blue-deep)}

.grid-num{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.grid-num button{background:#e8f3ff;border-radius:14px;padding:10px 0;font-family:var(--display);font-size:22px;box-shadow:0 4px 0 var(--line)}
.grid-num button.has{background:var(--sun);box-shadow:0 4px 0 var(--sun-deep)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#e8f3ff;border-radius:999px;padding:6px 14px;font-size:17px;box-shadow:0 3px 0 var(--line)}
.chip.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-deep)}
.nickview{font-family:var(--display);font-size:32px;color:var(--blue-deep);text-align:center;padding:6px}

/* 탐험 지도 */
.isle{border-radius:26px;padding:16px 16px 20px;background:var(--card);box-shadow:0 8px 0 rgba(15,74,150,.22);display:flex;flex-direction:column;gap:12px;border-top:10px solid var(--c)}
.isle.l1{--c:var(--blue);--d:var(--blue-deep)} .isle.l2{--c:var(--good);--d:#0e7d55} .isle.l3{--c:var(--grape);--d:#523bc0}
.isle h2{font-size:24px;color:var(--d)}
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.path::before{content:"";position:absolute;left:16%;right:16%;top:38px;border-top:5px dotted var(--line)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px}
.node i{font-style:normal;width:76px;height:76px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:20px;line-height:1.1;box-shadow:0 6px 0 var(--d);border:4px solid #fff;outline:3px solid var(--c)}
.stars{letter-spacing:1px;color:var(--sun);-webkit-text-stroke:1px var(--sun-deep);font-size:20px}
.stars u{text-decoration:none;color:#e6eef8;-webkit-text-stroke:1px var(--line)}

.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.55)}
.dots i.on{background:var(--sun)}
.stagebar{color:#fff;font-family:var(--display);font-size:18px;text-shadow:0 2px 0 var(--blue-deep)}
.duo{display:flex;align-items:center;justify-content:center;gap:12px}
.wordcard{background:var(--sun);border-radius:18px;padding:8px 32px;font-family:var(--display);font-size:40px;box-shadow:0 6px 0 var(--sun-deep)}
.w{font-family:var(--display);font-size:26px}
.hl{color:var(--bad);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.ask{font-size:20px;text-align:center;margin:0}
.fb{border-radius:16px;padding:10px 14px;font-size:17px;background:#e8f3ff}
.fb.ok{background:#dcf6ea} .fb.no{background:#ffe4e1}
.fb b{font-family:var(--display);font-weight:400;font-size:20px;display:block}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}

.shelf{display:flex;flex-direction:column;gap:5px}
.shelf .word{border-radius:12px;padding:5px 16px;color:#fff;background:var(--blue);box-shadow:inset 10px 0 0 rgba(0,0,0,.18),0 3px 0 rgba(0,0,0,.18);padding-left:24px}
.shelf .word:nth-of-type(5n+2){background:var(--good)} .shelf .word:nth-of-type(5n+3){background:var(--grape)}
.shelf .word:nth-of-type(5n+4){background:#ef7b2d} .shelf .word:nth-of-type(5n+5){background:#d9539a}
.shelf .word .hl{color:var(--sun)}
.shelf .word.just{outline:4px solid var(--sun)}
.gap{border:3px dashed var(--blue);border-radius:12px;padding:4px;font-size:15px;color:var(--blue-deep);background:#f4faff;width:100%;font-family:var(--display)}
.gap.miss{border-color:var(--bad);color:var(--bad);background:#ffe4e1}

.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:10px;min-height:50px;border:3px dashed var(--line);border-radius:12px;padding:4px 12px;width:100%;text-align:left;background:#f4faff}
.slot em{font-style:normal;font-family:var(--display);color:var(--ink-soft);width:28px}
.slot.fill{border-style:solid;border-color:var(--blue)}
.slot.bad{border-color:var(--bad);background:#ffe4e1}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;justify-content:center}
.pool button{background:var(--sun);border-radius:14px;padding:6px 16px;box-shadow:0 5px 0 var(--sun-deep)}

/* 60초 도전 */
.hud{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:0 5px 0 rgba(15,74,150,.22)}
.bar{flex:1;height:22px;background:#dcebfb;border-radius:999px;overflow:hidden}
.bar div{height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,var(--good),#8be36b)}
.bar.low div{background:linear-gradient(90deg,var(--bad),#ff9a6b)}
.bar.ice div{background:linear-gradient(90deg,#6fd3ff,#d8f5ff)}
.num{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;display:inline-block;min-width:2ch;text-align:right}
.scorechip{font-family:var(--display);font-size:24px;background:var(--sun);border-radius:999px;padding:0 14px;box-shadow:0 3px 0 var(--sun-deep);display:inline-block}
.combo{font-family:var(--display);font-size:22px;color:#fff;background:var(--blue);border-radius:999px;padding:2px 14px;box-shadow:0 4px 0 var(--blue-deep);display:inline-block}
.combo.fire{background:linear-gradient(#ffcd45,#ff5a2d);box-shadow:0 4px 0 #b93229;font-size:26px}
.pips{display:flex;gap:5px;align-items:center;font-family:var(--display);font-size:16px;color:#fff;text-shadow:0 2px 0 rgba(15,74,150,.6)}
.pips i{width:16px;height:16px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.3)}
.pips i.on{background:var(--sun)}
.tray{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.item{position:relative;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:16px;padding:8px 14px;font-family:var(--display);font-size:17px;box-shadow:0 5px 0 rgba(15,74,150,.25)}
.item svg{width:26px;height:26px}
.item b{font-weight:400;background:var(--grape);color:#fff;border-radius:999px;min-width:24px;text-align:center;padding:0 6px}
.item.none{opacity:.45}
.count{font-family:var(--display);font-size:170px;color:#fff;text-shadow:0 8px 0 var(--blue-deep);text-align:center;line-height:1.1}

.score{font-family:var(--display);font-size:84px;color:var(--blue-deep);line-height:1}
.title{font-family:var(--display);font-size:26px;background:var(--sun);border-radius:999px;padding:4px 22px;box-shadow:0 4px 0 var(--sun-deep)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:left;border-bottom:2px solid #e8f3ff}
th{font-size:15px;color:var(--ink-soft);font-weight:400}
td.rk b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;font-family:var(--display);font-weight:400;background:#e8f3ff}
tr.r1 td.rk b{background:#ffcd45} tr.r2 td.rk b{background:#cfd8e3} tr.r3 td.rk b{background:#e9a36b}
tr.me td{background:#fff3c9;font-family:var(--display)}
.note{font-size:15px;color:var(--ink-soft);margin:0}
.pin{font-family:var(--display);font-size:40px;letter-spacing:14px;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.keys button{background:#e8f3ff;border-radius:14px;padding:10px;font-family:var(--display);font-size:24px;box-shadow:0 4px 0 var(--line)}

.float{position:fixed;z-index:58;pointer-events:none;font-family:var(--display);font-size:40px;color:var(--sun);-webkit-text-stroke:2px var(--blue-deep);paint-order:stroke fill;transform:translate(-50%,-50%)}
.banner{font-family:var(--display);font-size:32px;color:#fff;background:var(--grape);padding:6px 28px;border-radius:999px;box-shadow:0 6px 0 #523bc0;text-align:center}
@media (max-width:420px){.grid-num{grid-template-columns:repeat(5,1fr)}.wordcard{font-size:32px;padding:8px 20px}.lead{font-size:24px}.logo{font-size:36px}.banner{font-size:30px}.node i{width:64px;height:64px;font-size:17px}.path::before{top:32px}}

@media (prefers-reduced-motion:no-preference){
  body::before{animation:drift 60s linear infinite alternate}
  @keyframes drift{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
  #app.enter{animation:enter .32s cubic-bezier(.2,1.4,.4,1)}
  @keyframes enter{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
  .masc{animation:bob 1.6s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-6px)}}
  .masc.happy,.masc.wow{animation:jump .45s ease-out 2}
  @keyframes jump{50%{transform:translateY(-16px) rotate(-6deg)}}
  .masc.sad{animation:shake .4s}
  .shake{animation:shake .4s}
  @keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .wordcard.drop{animation:drop .35s cubic-bezier(.2,1.6,.4,1)}
  @keyframes drop{from{transform:translateY(-40px) scale(.6);opacity:0}}
  .popnum{animation:popnum .4s}
  .count{animation:popnum .5s}
  @keyframes popnum{from{transform:scale(1.9)}to{transform:scale(1)}}
  .word.just{animation:popnum .35s}
  .combo{animation:popnum .3s}
  .combo.fire{animation:fire .35s infinite alternate}
  @keyframes fire{to{transform:scale(1.08) rotate(-2deg)}}
  .bar.low{animation:pulse .4s infinite alternate}
  @keyframes pulse{to{opacity:.5}}
  .big.sun .ico{animation:bob .7s ease-in-out infinite alternate}
  .node.rec i{animation:bob .6s ease-in-out infinite alternate}
  .float{animation:floatUp .9s ease-out forwards}
  @keyframes floatUp{to{transform:translate(-50%,-190%) scale(1.5);opacity:0}}
  .banner{animation:bannerIn 1.4s ease-out forwards}
  @keyframes bannerIn{0%{transform:scale(.2);opacity:0}18%{transform:scale(1.15);opacity:1}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
  #flash.ok{animation:flashA .4s;background:radial-gradient(transparent 45%,rgba(25,178,122,.55))}
  #flash.no{animation:flashA .4s;background:radial-gradient(transparent 45%,rgba(240,85,74,.6))}
  #flash.gold{animation:flashA .7s;background:radial-gradient(transparent 30%,rgba(255,205,69,.8))}
  @keyframes flashA{from{opacity:1}to{opacity:0}}
}

.half{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big.small{padding:12px 14px;gap:10px}.big.small b{font-size:21px}.big.small .ico{width:42px;height:42px;font-size:20px}
.big.white{background:var(--card);color:var(--blue-deep);box-shadow:0 7px 0 var(--line)}.big.white .ico{background:var(--sun)}
.sheet p{margin:0}
/* 큰 지도 */
.map{position:relative;width:100%;aspect-ratio:680/960;border-radius:26px;overflow:hidden;box-shadow:0 8px 0 rgba(15,74,150,.22);background:#59b8f0}
.map svg.bg{position:absolute;inset:0;width:100%;height:100%}
.map .node{position:absolute;transform:translate(-50%,-38px)}
.map .node:active{transform:translate(-50%,-34px);box-shadow:none}
.node.l1{--c:var(--blue);--d:var(--blue-deep)}.node.l2{--c:var(--good);--d:#0e7d55}.node.l3{--c:var(--grape);--d:#523bc0}
.node.boss{--c:var(--bad);--d:#b93229}.node.lock{--c:#9aa9bb;--d:#6f7f93}
.map .node .stars{background:rgba(255,255,255,.92);border-radius:999px;padding:0 7px;font-size:16px}
.map .me,.map .deco{position:absolute;pointer-events:none;line-height:0}
.map .me{transform:translate(-50%,-88px);z-index:2}
.map .deco{transform:translate(-50%,-50%)}
/* 모험 띠 */
.scene{position:relative;height:88px;border-radius:20px;overflow:hidden;box-shadow:0 5px 0 rgba(15,74,150,.22);
  background:linear-gradient(#aee0ff 0 62%,#86d466 62% 70%,#63b84b 70%)}
body.fever .scene{background:linear-gradient(#ffe2a0 0 62%,#f5a23f 62% 70%,#dc7d1f 70%)}
.scene .me2{position:absolute;left:12%;bottom:24px;line-height:0}
.scene .foe{position:absolute;right:12%;bottom:24px;line-height:0}
.scene .tag{position:absolute;left:10px;top:6px;font-family:var(--display);font-size:15px;color:var(--blue-deep);background:rgba(255,255,255,.85);border-radius:999px;padding:0 10px}
/* 상자 고르기 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,48,79,.62);display:grid;place-items:center;padding:16px}
.modal .sheet{max-width:520px;width:100%}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.box{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-size:17px;border-radius:18px;padding:8px 4px;background:#eef6ff;box-shadow:0 5px 0 var(--line)}
.box svg{width:100%;max-width:120px;height:auto}
.box.dim{opacity:.45;box-shadow:none}
.box.pick{background:#fff3c9;outline:4px solid var(--sun);box-shadow:none}
/* 칭호 도감 */
.tl{display:flex;flex-direction:column;gap:10px}
.tl>*{display:flex;flex-direction:column;text-align:left;border-radius:16px;padding:10px 14px;background:#eff3f8;width:100%;font-size:16px}
.tl .got{background:#fff3c9;box-shadow:0 4px 0 var(--sun-deep)}
.tl .rep{outline:4px solid var(--blue)}
.tl b{font-family:var(--display);font-weight:400;font-size:22px}
.tl .lockd b{color:#8493a8}
.title{display:inline-block}
/* 보스 */
.hpbar{flex:1;height:22px;background:#f6d5d2;border-radius:999px;overflow:hidden}
.hpbar div{height:100%;background:linear-gradient(90deg,#d63b3b,#ff8a6b);border-radius:999px;transition:width .3s}
.hearts{font-size:26px;color:var(--bad);letter-spacing:2px;line-height:1}.hearts u{text-decoration:none;color:#d5dce6}
.wipe{position:fixed;top:0;bottom:0;left:-30vw;width:160vw;z-index:70;pointer-events:none;display:grid;place-items:center;
  background:linear-gradient(90deg,transparent,#fff 18%,#fff 82%,transparent);transform:translateX(-110%)}
@media (prefers-reduced-motion:no-preference){
  .wipe{animation:wipe .85s ease-in-out forwards}
  @keyframes wipe{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
  .wipe .masc{animation:none;transform:rotate(16deg)}
  .scene .foe svg{animation:bob .5s ease-in-out infinite alternate}
  .scene.hit .me2{animation:dash .55s}
  @keyframes dash{0%{left:12%}45%{left:60%;transform:rotate(14deg)}100%{left:12%}}
  .scene.hit .foe.old{animation:ko .6s .18s forwards}
  @keyframes ko{to{transform:translate(150px,-140px) rotate(600deg);opacity:0}}
  .scene.hit .foe.new{animation:arrive .4s .65s backwards}
  @keyframes arrive{from{transform:translateX(220px)}}
  .scene.miss .foe{animation:lunge .45s}
  @keyframes lunge{50%{right:56%}}
  .scene.miss .me2{animation:shake .4s .15s}
  .box:not(.dim):not(.pick) svg{animation:bob .45s ease-in-out infinite alternate}
  .box:nth-child(2) svg{animation-delay:.15s}.box:nth-child(3) svg{animation-delay:.3s}
  .box.pick svg{animation:popnum .45s}
  .node.boss i{animation:fire .4s infinite alternate}
}

/* 월드맵 */
.map{border:5px solid #17304f;box-shadow:0 8px 0 #17304f;background:#3fa9f5}
.map .node{position:absolute;transform:translate(-50%,-26px);display:flex;flex-direction:column;align-items:center;gap:3px}
.map .node:active{transform:translate(-50%,-23px);box-shadow:none}

const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".split("");

const RAW=`

까치 까마귀 꼬리 꼬마 꽃 꾀꼬리 꿀 꿈 끈

차 참새 참외 창문 책 책상 책가방 처음 천둥 청소 초 초록 촛불 축구 춤 치마 치약 친구 칠판 침대

타조 탁자 탑 태양 태권도 토끼 토마토 통 튤립 트럭
파 파도 파리 팔 팽이 편지 포도 표 풀 풍선 피아노 피리
하늘 하마 하루 학교 학생 한글 할머니 할아버지 해 해바라기 햇빛 허리 형 호랑이 호박 호수 화분 화가 회의 휴지 흙 희망 힘`;
const WORDS=[...new Set(RAW.split(/\s+/).filter(Boolean))];
function dec(ch){const c=ch.charCodeAt(0)-0xAC00;return{cho:Math.floor(c/588),jung:Math.floor(c%588/28),jong:c%28};}
const cmp=(a,b)=>a<b?-1:a>b?1:0;
const key1=w=>dec(w[0]).cho;
const key2=w=>{const d=dec(w[0]);return d.cho*100+d.jung;};
function groupBy(f){const m=new Map();for(const w of WORDS){const k=f(w);if(!m.has(k))m.set(k,[]);m.get(k).push(w);}return m;}
const G1=groupBy(key1),G2=groupBy(key2);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
// level 1: 첫 자음자가 모두 다름 / 2: 첫 자음자는 같고 모음자가 다름 / 3: 첫 자음자와 모음자가 같음(받침·둘째 글자 비교)
function makeSet(level,n){
  if(level===1)return shuffle([...G1.keys()]).slice(0,n).map(c=>pick(G1.get(c)));
  if(level===2){
    const cands=[...G1.values()].filter(ws=>new Set(ws.map(key2)).size>=n+1);
    const seen=new Set(),out=[];
    for(const w of shuffle(pick(cands))){const k=key2(w);if(!seen.has(k)){seen.add(k);out.push(w);if(out.length===n)break;}}
    return out;
  }
  const cands=[...G2.values()].filter(ws=>ws.length>=n+1);
  return shuffle(pick(cands)).slice(0,n);
}
function nextWord(level,list,used){
  let pool;
  if(level===1){const cs=new Set(list.map(key1));pool=WORDS.filter(w=>!cs.has(key1(w)));}
  else if(level===2){const ks=new Set(list.map(key2));pool=G1.get(key1(list[0])).filter(w=>!ks.has(key2(w)));}
  else pool=G2.get(key2(list[0])).filter(w=>!list.includes(w));
  pool=pool.filter(w=>!used.has(w));
  return pool.length?pick(pool):null;
}
const ORD=["첫째","둘째","셋째","넷째","다섯째"];
const hasJong=w=>(w.charCodeAt(w.length-1)-0xAC00)%28>0;
// a가 b보다 앞에 오는 이유
function explain(a,b){
  const n=Math.min(a.length,b.length);
  for(let i=0;i<n;i++){
    if(a[i]!==b[i]){
      const x=dec(a[i]),y=dec(b[i]);let part,l,r;
      if(x.cho!==y.cho){part="자음자를";l=CHO[x.cho];r=CHO[y.cho];}
      else if(x.jung!==y.jung){part="모음자를";l=JUNG[x.jung];r=JUNG[y.jung];}
      else{part="받침을";l=JONG[x.jong]||"받침 없음";r=JONG[y.jong]||"받침 없음";}
      return{i,text:`${ORD[i]} 글자의 ${part} 비교해요. ${l} → ${r} 순서라서 「${a}」 다음에 「${b}」${hasJong(b)?"이":"가"} 와요.`};
    }
  }
  return{i:-1,text:`앞 글자가 모두 같아요. 글자 수가 적은 「${a}」${hasJong(a)?"이":"가"} 먼저 와요.`};
}

function note(f,at,dur,type,vol){
  const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(vol||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
function sfx(name,mult){
  if(store.mute)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    if(name==="whoosh"){
      const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type="sawtooth";
      o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(1600,t+.4);o.frequency.exponentialRampToValueAtTime(300,t+.75);
      g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.07,t+.3);g.gain.exponentialRampToValueAtTime(.001,t+.78);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.8);return;
    }
    for(const [f,at,dur,type,vol] of NOTES[name])note(f*(mult||1),at,dur,type,vol);
  }catch(e){}
}

const fxOK=typeof requestAnimationFrame==="function"&&typeof document.createElement==="function"&&!matchMedia("(prefers-reduced-motion: reduce)").matches;
let parts=[],raf=0;
function spawn(list){
  if(!fxOK)return;
  const cv=document.getElementById("fx");parts.push(...list);
  if(!raf){cv.width=innerWidth;cv.height=innerHeight;raf=requestAnimationFrame(loop);}
}
function loop(){
  const cv=document.getElementById("fx"),x=cv.getContext("2d");x.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    x.save();x.globalAlpha=Math.min(1,p.life/18);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
    if(p.star){x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5,r=i%2?p.s*.45:p.s;x.lineTo(Math.sin(a)*r,-Math.cos(a)*r);}x.fill();}
    else x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);
    x.restore();
  }
  raf=parts.length?requestAnimationFrame(loop):0;
}
function burst(n){
  const {x,y}=XY;
  spawn(Array.from({length:n||20},()=>{const a=Math.random()*6.28,v=3+Math.random()*7;return{x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,g:.3,r:0,vr:.25,s:6+Math.random()*7,c:pick(COLS),life:34+Math.random()*16,star:Math.random()<.6};}));
}

}

function newQuestion(){
  S.enc=pick(ENC_LIST);S.fb=null;S.done=false;S.first=true;S.miss=[];S.just=null;S.badIdx=null;S.gone=[];
  S.show=null;
  if(S.act==="base1"||S.act==="base2"){
    S.usedB=S.usedB||[];const b=pick(BASES.filter(x=>!S.usedB.includes(x.base)));S.usedB.push(b.base);S.b=b;
    const stem=b.base.slice(0,-1);
    if(S.act==="base1"){S.ans=b.base;S.opts=shuffle([b.base,b.f[3],b.f[0],b.f[1]]);}
    else{S.ans=stem;S.opts=shuffle([stem,...[...new Set([b.f[1].slice(0,-1),b.f[2].slice(0,-1),b.f[3].slice(0,-1),b.f[0].slice(-1),b.f[1].slice(-1)])].filter(x=>x!==stem).slice(0,3)]);}
  }
  else if(S.act==="base3"){const set=shuffle(BASES).slice(0,6),t=set.pop();S.word=t.base;S.show=t.f[3];S.list=set.map(x=>x.base).sort(cmp);}
  else if(S.act==="ab"){[S.word,S.base]=shuffle(makeSet(S.lv,2));}
  else if(S.act==="order"){S.pool=shuffle(makeSet(S.lv,5));S.slots=Array(5).fill(null);}
  else{const set=makeSet(S.lv,6);S.word=set.pop();S.list=set.sort(cmp);}
}
function finishPractice(){
  const a=ACTS[S.act],st=starsFor(S.right,a.total),p=me();
  const was=totalStars(p);p.stars=p.stars||{};const k=S.act+S.lv;if(st>(p.stars[k]||0))p.stars[k]=st;
  const coin=S.right+st*3;p.coins=(p.coins||0)+coin;bump("stage");
  const got=checkTitles(p),unlocked=was<MAXSTAR&&totalStars(p)===MAXSTAR;save();
  const data={act:S.act,lv:S.lv,right:S.right,got,unlocked,coin},ei=STAGES.findIndex(x=>x.k===S.act&&x.lv===S.lv);
  p.seen=p.seen||{};

  else showPresult(data);

function levelFor(score){return score<4?1:score<9?2:3;}
function newRound(){
  const lv=levelFor(S.score);let w=null;
  if(S.list&&lv===S.lv)w=nextWord(lv,S.list,S.used);
  while(!w){S.list=makeSet(lv,5).sort(cmp);S.just=null;w=nextWord(lv,S.list,S.used)||nextWord(lv,S.list,new Set());}
  S.lv=lv;S.word=w;S.used.add(w);S.miss=[];S.gone=[];S.encPrev=S.enc;S.enc=pick(ENC_LIST);S.firstTry=true;
}

function beginChallenge(){

function tick(){
  if(S.pauseAt)return;
  const now=Date.now(),frozen=now<S.freezeUntil,left=S.end-(frozen?S.freezeUntil:now);
  if(left<=0)return endChallenge();
  const secLeft=Math.ceil(left/1000);
  if(!frozen&&secLeft<=5&&secLeft!==S.beeped){S.beeped=secLeft;sfx("beep");}
  const f=document.getElementById("barfill"),s=document.getElementById("sec"),b=document.getElementById("bar");
  if(f){f.style.width=Math.min(100,Math.max(0,left/GAME_MS*100))+"%";s.textContent=secLeft;b.classList.toggle("low",left<10000&&!frozen);b.classList.toggle("ice",frozen);}
}
function endChallenge(){
  const p=me(),b=p.best,better=!b||S.score>b.score||(S.score===b.score&&S.wrong<b.wrong);
  if(better)p.best={score:S.score,wrong:S.wrong};
  p.maxStreak=Math.max(p.maxStreak||0,S.maxStreak);
  if(S.wrong===0&&S.score>=8)p.clean=true;
  const coin=S.score*2;p.coins=(p.coins||0)+coin;bump("ch");
  const got=checkTitles(p);save();
  const nb=better&&S.score>0,n=S.score;
  go("cresult",{score:S.score,wrong:S.wrong,maxStreak:S.maxStreak,newBest:nb,got,coin});
  sfx(nb?"best":"end");if(nb||got.length){confetti();flash("gold");}countUp(n);
}

const MODE=typeof firebase==="undefined"?"local":Q.get("admin")?"admin":Q.get("t")?"teacher":Q.get("c")?"student":"land";
let DB=null,UID=null,CLS=null,CLASSES=[],TROWS={no:0,cid:"",rows:[]},BOARD={at:0,rows:[],busy:0},lastPush="",lastBoard="",pend={};
const SYNC_ON=["home","presult","cresult","bossend","practice","event"];
const baseUrl=()=>location.origin+location.pathname;
const rid=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>"abcdefghjkmnpqrstuvwxyz23456789"[x%31]).join("");};
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
const numOf=()=>S.num.split("-")[1];
const stuRef=()=>DB.doc("classes/"+CLS.cid+"/students/"+numOf());
/* 서버에 저장된 내 기록이 이 기기의 것보다 새것이면 가져온다 */
async function pullProfile(){
  try{
    const snap=await stuRef().get();if(!snap.exists)return;
    const r=snap.data(),loc=store.profiles[S.num];
    if(!loc||(r.upd||0)>=(loc.upd||0)){store.profiles[S.num]=Object.assign({},r,{err:loc&&loc.err});save();}
  }catch(e){}
}
/* 화면이 바뀌는 길목에서만 서버에 올린다(문제마다 올리면 무료 한도를 넘는다). 달라진 것이 없으면 보내지 않는다. */
function syncNow(){
  if(!DB||MODE!=="student"||!CLS||!S.num)return;
  const p=store.profiles[S.num];if(!p)return;
  try{
    const data=JSON.parse(JSON.stringify(p));delete data.err;const js=JSON.stringify(data);
    if(js!==lastPush){lastPush=js;stuRef().set(data).catch(()=>{lastPush="";});}
    if(Object.keys(pend).length){
      const sent=pend,inc={};pend={};
      for(const k in sent)inc[k]=firebase.firestore.FieldValue.increment(sent[k]);
      DB.doc("classes/"+CLS.cid+"/stats/"+numOf()).set(inc,{merge:true}).catch(()=>{for(const k in sent)pend[k]=(pend[k]||0)+sent[k];});
    }
    if(p.best){
      const e={n:p.nick,s:p.best.score,w:p.best.wrong,t:repTitle(p)},bj=JSON.stringify(e);
      if(bj!==lastBoard){lastBoard=bj;BOARD.at=0;DB.doc("board/"+CLS.cid).set({no:CLS.no,e:{[numOf()]:e}},{merge:true}).catch(()=>{lastBoard="";});}
    }
  }catch(e){}
}
async function loadBoard(){
  try{
    const q=await DB.collection("board").get(),rows=[];
    q.forEach(d=>{const v=d.data();for(const [num,e] of Object.entries(v.e||{}))rows.push({k:v.no+"-"+num,nick:e.n,score:e.s,wrong:e.w,t:e.t||""});});
    BOARD.rows=rows;
  }catch(e){}
  BOARD.at=Date.now();
}
async function loadClasses(){
  const q=await DB.collection("classes").get(),ids=[];q.forEach(d=>ids.push({cid:d.id,no:d.data().no}));
  for(const c of ids){const t=await DB.doc("classes/"+c.cid+"/secret/t").get();c.tk=t.exists?t.data().tk:"";}
  CLASSES=ids.sort((a,b)=>a.no-b.no);
}
async function loadStats(cid,no){
  const [a,b]=await Promise.all([DB.collection("classes/"+cid+"/students").get(),DB.collection("classes/"+cid+"/stats").get()]);
  const st={},rows=[];b.forEach(d=>{st[d.id]=d.data();});
  a.forEach(d=>{const p=d.data(),e=st[d.id]||{};rows.push({num:d.id,nick:p.nick||"",stars:totalStars(p),best:p.best,err:{1:[e.e1n||0,e.e1w||0],2:[e.e2n||0,e.e2w||0],3:[e.e3n||0,e.e3w||0],4:[e.e4n||0,e.e4w||0]}});});
  TROWS={no,cid,rows:rows.sort((x,y)=>x.num-y.num)};
}
async function boot(){
  if(MODE==="local"){if(store.last&&store.profiles[store.last]){S.num=store.last;S.screen="confirm";}return render();}
  if(MODE==="land"){S.screen="land";return render();}
  S.screen="boot";render();
  try{
    firebase.initializeApp(FB);
    UID=(await firebase.auth().signInAnonymously()).user.uid;
    const db=firebase.firestore();
    if(MODE==="admin"){await db.doc("admins/"+UID).set({k:Q.get("admin")});DB=db;await loadClasses();return go("admin");}
    const [cid,tk]=(Q.get("t")||Q.get("c")).split(".");
    if(MODE==="teacher")await db.doc("teachers/"+UID).set({cid,tk:tk||""});
    const d=await db.doc("classes/"+cid).get();
    if(!d.exists)throw {code:"no-class"};
    DB=db;CLS={cid,no:d.data().no};
    if(MODE==="teacher")return go("thome");
    if(store.last&&store.profiles[store.last]&&clsOf(store.last)===String(CLS.no)){S.num=store.last;await pullProfile();return go("confirm");}
    go("who");
  }catch(e){
    const c=e&&e.code||"";
    go("err",{msg:c==="permission-denied"?"이 링크로는 들어갈 수 없어요. 링크가 잘못되었거나 새 링크로 바뀌었을 수 있어요. 링크를 다시 받아 주세요."
      :c==="no-class"?"없는 반의 링크예요. 선생님께 링크를 다시 받아 주세요."
      :"서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요. ("+(c||e&&e.message||e)+")"});
  }
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)syncNow();});

  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  XY={x:e.clientX||innerWidth/2,y:e.clientY||innerHeight/2};
  if(!QUIET.includes(b.dataset.act))sfx("tap");
